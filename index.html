<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something BIG is Coming</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto}
body{min-height:100vh;font-family:'DM Sans',sans-serif;background:#07070f;color:#f0f0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.bg-gradient{position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(124,58,237,.35) 0%,transparent 65%),radial-gradient(ellipse 50% 40% at 90% 60%,rgba(233,30,140,.25) 0%,transparent 55%),radial-gradient(ellipse 40% 30% at 10% 80%,rgba(124,58,237,.2) 0%,transparent 50%);pointer-events:none;z-index:0}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 90% 90% at 50% 50%,black 20%,transparent 100%);pointer-events:none;z-index:0}
.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);animation:float 8s ease-in-out infinite;z-index:0}
.orb-1{width:400px;height:400px;background:radial-gradient(circle,rgba(233,30,140,.18),transparent 70%);top:-100px;right:-80px}
.orb-2{width:300px;height:300px;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 70%);bottom:-80px;left:-60px;animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;width:2px;height:2px;border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* Main content */
.content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px;max-width:700px;width:100%}

.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(233,30,140,.12);border:1px solid rgba(233,30,140,.3);border-radius:50px;padding:5px 14px;font-size:.72rem;font-weight:600;color:#f48fb1;letter-spacing:.1em;text-transform:uppercase;margin-bottom:32px;animation:fadeDown .8s ease .1s both}
.badge-dot{width:6px;height:6px;background:#e91e8c;border-radius:50%;animation:pulse-dot 1.5s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}

.headline{font-family:'Syne',sans-serif;font-size:clamp(2.8rem,9vw,5.5rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:12px;animation:fadeDown .8s ease .2s both}
.headline .grad{background:linear-gradient(135deg,#e91e8c 0%,#7c3aed 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.tagline{font-family:'Syne',sans-serif;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:500;color:rgba(240,240,248,.55);letter-spacing:.06em;text-transform:uppercase;margin-bottom:56px;animation:fadeDown .8s ease .35s both}

/* Countdown */
.countdown-wrap{animation:fadeDown .8s ease .5s both}
.countdown-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(160,160,192,.4);margin-bottom:18px}
.countdown{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.cd-unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.cd-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:18px;width:90px;height:90px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;position:relative;overflow:hidden;transition:border-color .3s}
.cd-box::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,transparent 50%)}
.cd-box.highlight{border-color:rgba(233,30,140,.45);box-shadow:0 0 30px rgba(233,30,140,.12)}
.cd-sep{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;color:rgba(233,30,140,.5);padding-top:16px}
.cd-lbl{font-size:.65rem;color:rgba(160,160,192,.45);letter-spacing:.1em;text-transform:uppercase}

.footer-note{position:fixed;bottom:20px;font-size:.72rem;color:rgba(160,160,192,.25);z-index:10}

@keyframes fadeDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:480px){
  .cd-box{width:68px;height:68px;font-size:1.7rem;border-radius:14px}
  .cd-sep{font-size:1.6rem;padding-top:12px}
  .countdown{gap:10px}
}
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="particles" id="particles"></div>

<div class="content">
  <div class="badge"><span class="badge-dot"></span>Coming Soon</div>

  <div class="headline">
    Something <span class="grad">BIG</span><br>is Coming
  </div>

  <div class="tagline">Stay Tuned &nbsp;·&nbsp; We're Almost Ready</div>

  <div class="countdown-wrap">
    <div class="countdown-label">Launching in</div>
    <div class="countdown">
      <div class="cd-unit"><div class="cd-box" id="cd-d">00</div><div class="cd-lbl">Days</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-box" id="cd-h">00</div><div class="cd-lbl">Hours</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-box" id="cd-m">00</div><div class="cd-lbl">Mins</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><div class="cd-box highlight" id="cd-s">00</div><div class="cd-lbl">Secs</div></div>
    </div>
  </div>
</div>

<div class="footer-note">© 2026 Saif Developers · All Rights Reserved</div>

<script>
(function(){
  const c=document.getElementById('particles');
  for(let i=0;i<25;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'vw';
    p.style.width=(Math.random()*3+1)+'px';
    p.style.height=p.style.width;
    p.style.animationDuration=(Math.random()*15+10)+'s';
    p.style.animationDelay=(Math.random()*-20)+'s';
    p.style.background=i%2===0?'rgba(233,30,140,0.7)':'rgba(124,58,237,0.7)';
    c.appendChild(p);
  }
})();

// Pakistan Standard Time (UTC+5) — set your launch date here
const LAUNCH = new Date('2026-06-06T00:00:00+05:00').getTime();
function tick(){
  const diff=Math.max(0,LAUNCH-Date.now());
  document.getElementById('cd-d').textContent=String(Math.floor(diff/86400000)).padStart(2,'0');
  document.getElementById('cd-h').textContent=String(Math.floor(diff%86400000/3600000)).padStart(2,'0');
  document.getElementById('cd-m').textContent=String(Math.floor(diff%3600000/60000)).padStart(2,'0');
  document.getElementById('cd-s').textContent=String(Math.floor(diff%60000/1000)).padStart(2,'0');
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
